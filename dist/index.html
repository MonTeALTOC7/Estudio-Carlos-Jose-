function startConcept(kind){const session={kind,index:0,taught:new Set(),answers:[],assisted:false,finished:false};conceptStep(session)}
function conceptStep(g,practice=false){const q=A.question(g.kind,g.index),demo=!practice&&g.index<4&&!g.taught.has(q.rule);if(demo){g.taught.add(q.rule);page(head(A.names[g.kind],relations,'Mira y escucha')+referenceScene(q)+'<div class="options concept-options">'+q.choices.map(o=>'<div class="choice '+(o.key===q.answer?'good':'')+'">'+art(o)+'</div>').join('')+'<p class="center">'+q.explanation+'</p><div class="row"><button class="soft" id="conceptHear">♫ Escuchar ejemplo</button><button class="primary" id="conceptTry">Ahora yo →</button></div>','concept');bindBack(relations);$('#conceptHear').onclick=()=>speak(q.explanation);$('#conceptTry').onclick=()=>conceptStep(g,true);speak(q.explanation);return}
 g.assisted=false;g.finished=false;page(head(A.names[g.kind],relations,(g.index<4?'Practico ':'Compruebo ')+(g.index<4?g.index+1:g.index-3)+' de '+(g.index<4?4:2))+'<h2 class="center">'+q.prompt+'</h2>'+referenceScene(q)+'<div class="options concept-options">'+E.shuffle(q.choices).map(o=>'<button class="choice" data-concept-answer="'+o.key+'" aria-label="'+escape(o.label)+'">'+art(o)+'</button>').join('')+'<div id="feedback" class="feedback" aria-live="polite"></div><div class="row"><button class="soft" id="conceptHear">♫ Escuchar</button><button class="soft" id="conceptHint">Ver una pista</button><button class="primary" id="conceptNext" hidden>Siguiente →</button></div>','concept');bindBack(relations);$('#conceptHear').onclick=()=>speak(q.prompt);$('#conceptHint').onclick=()=>{g.assisted=true;$('#feedback').innerHTML='Mira el ejemplo: '+art(q.choices.find(x=>x.key===q.answer));speak(q.explanation)};$$('[data-concept-answer]').forEach(b=>b.onclick=()=>{if(g.finished)return;if(b.dataset.conceptAnswer!==q.answer){g.assisted=true;b.classList.add('try');b.disabled=true;$('#feedback').textContent='Vamos a mirar otra vez. Puedes pedir una pista.';speak('Vamos a mirar otra vez.');return}g.finished=true;$$('[data-concept-answer]').forEach(x=>x.disabled=true);b.classList.add('good');A.record(s,g.kind,!g.assisted);g.answers.push({independent:!g.assisted,check:g.index>=4});save();$('#feedback').textContent=g.assisted?'¡Lo encontramos juntos!':'¡Lo encontraste!';$('#conceptHint').hidden=true;$('#conceptNext').hidden=false;speak($('#feedback').textContent)});$('#conceptNext').onclick=()=>{g.index++;if(g.index<6)conceptStep(g);else conceptResults(g)};speak(q.prompt)
}
function conceptResults(g){const independent=g.answers.filter(x=>x.independent).length,check=g.answers.filter(x=>x.check&&x.independent).length;s.sessions++;save();page(head('Un paso más',relations,'Sin nota')+'<div class="study"><div class="object">🌱</div><h2>¡Terminamos!</h2><p>'+independent+' respuestas sin ayuda · '+(6-independent)+' con ayuda.</p><p>En la comprobación: '+check+' de 2 sin ayuda.</p><p>Ahora busquen un ejemplo con objetos de casa.</p><button id="conceptDone" class="primary">Elegir otro juego</button></div>','conceptResult');bindBack(relations);$('#conceptDone').onclick=relations}
function activityReport(){const labels={...A.names,colorImage:'Color e imagen',shapeObject:'Figura y objeto',matching:'Unir parejas'};const entries=Object.entries(s.activities||{});return entries.length?'<h3>Relaciones y juegos</h3><div class="reports">'+entries.map(([key,r])=>'<div class="report"><b>'+escape(labels[key]||key)+'</b><p>'+r.independent+' sin ayuda · '+r.supported+' con ayuda</p></div>').join('')+'</div>':''}

function parents(){const d=$('#dialog');$('#dialogContent').innerHTML='<h2>Para mamá o papá</h2><p>Escribe el resultado: 4 + 3</p><input id="gate" inputmode="numeric" aria-label="Respuesta"><button id="enter" class="primary">Entrar</button><p id="gateMessage"></p>';d.showModal();$('#enter').onclick=()=>{if($('#gate').value.trim()==='7')dashboard();else $('#gateMessage').textContent='Revisa la respuesta.'};$('#gate').onkeydown=e=>{if(e.key==='Enter')$('#enter').click()}}
function dashboard(){voices();$('#dialogContent').innerHTML='<h2>Aprende desde cero</h2><p>La app inicia con 1–3, a–e y dos colores o figuras. Dos aciertos independientes seguidos por símbolo permiten ampliar el grupo. Lo descubierto permanece disponible aunque necesite repaso. Es una regla del juego, no una valoración escolar.</p><label for="name">Nombre (opcional)</label><input id="name" maxlength="24" value="'+escape(s.name)+'"><p>Si no suena, activa el sonido ♫ y revisa el volumen del teléfono.</p>'+(voiceList.length?'':'<p>No se detectaron voces españolas. Revisa las voces de texto a voz instaladas en el teléfono y vuelve a abrir la app.</p>')+'<label for="voice">Voz en español</label><select id="voice"><option value="">Automática</option>'+voiceList.map(v=>'<option value="'+escape(v.voiceURI)+'" '+(s.voice===v.voiceURI?'selected':'')+'>'+escape(v.name)+' · '+(v.localService?'en dispositivo':'puede necesitar internet')+'</option>').join('')+'</select><label for="rate">Velocidad</label><select id="rate">'+[.75,.85,1].map(v=>'<option value="'+v+'" '+(s.rate===v?'selected':'')+'>'+v+'</option>').join('')+'</select><button class="primary" id="settings">Guardar y escuchar</button><h3 style="margin-top:24px">Lo que está practicando</h3><div class="reports">'+Object.keys(E.groups).map(a=>{const rows=E.groups[a].filter(x=>E.rec(s,a,x).seen||E.rec(s,a,x).independent||E.rec(s,a,x).supported);return '<div class="report"><b>'+titles[a]+'</b>'+(!rows.length?'<p>Aún por explorar</p>':rows.map(x=>{const r=E.rec(s,a,x);return '<p>'+escape(x)+': '+r.independent+' sin ayuda · '+r.supported+' con ayuda'+(r.streak<2?' · Conviene repasar':' · Seguir practicando')+'</p>'}).join(''))+'</div>'}).join('')+'</div>'+activityReport()+'<p>Trazos que recorrieron la guía: '+s.drawings+'.</p><div class="hint">Prueba una actividad corta y luego usa papel, juguetes y objetos de casa. El reto no reproduce el examen del colegio. Las respuestas con pista se registran por separado.</div><details style="margin:16px 0"><summary>Referencia para el adulto</summary><p>Adaptación básica del Cuadernillo Didáctico de III Nivel, MINED (2021): cantidades y X (p. 6), posiciones (pp. 8–9), unión de figuras (p. 14), vocales y trazos (pp. 19–22) y cantidades con números (p. 27). Se seleccionan habilidades iniciales; no se cubre todo el año escolar.</p><p>Los datos quedan en este navegador. No se envían a un servidor. La voz usa el servicio del dispositivo o del navegador. Las voces en línea pueden necesitar conexión.</p></details><div class="row"><button class="soft" id="installHelp">Cómo instalar</button><button class="soft" id="reset">Reiniciar progreso</button></div>'+(!storage?'<p>Este navegador no permite guardar el avance.</p>':'');$('#settings').onclick=()=>{s.name=$('#name').value.trim();s.voice=$('#voice').value;s.rate=+$('#rate').value;save();speak('Hola. Vamos a mirar, escuchar y aprender juntos.');notice('Preferencias guardadas')};$('#installHelp').onclick=()=>notice('Abre el enlace HTTPS en Chrome: menú ⋮ → Instalar aplicación o Añadir a inicio. En iPhone: Safari → Compartir → Añadir a inicio.');$('#reset').onclick=()=>{if(confirm('¿Borrar solamente el progreso de esta aplicación?')){const keep={name:s.name,voice:s.voice,rate:s.rate,sound:s.sound};s={...E.fresh(),...keep};save();dashboard()}}}
$('#home').onclick=home;$('#parents').onclick=parents;$('#sound').onclick=()=>{s.sound=!s.sound;if(!s.sound&&'speechSynthesis'in window)speechSynthesis.cancel();save();if(s.sound)speak('Vamos a escuchar.')};$('#closeDialog').onclick=()=>{$('#dialog').close();if(view==='home')home()};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#install').hidden=false});$('#install').onclick=async()=>{if(!installPrompt)return;await installPrompt.prompt();installPrompt=null;$('#install').hidden=true};addEventListener('appinstalled',()=>{$('#install').hidden=true});
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{window.appOfflineReady=true}).catch(()=>{notice('No se pudo preparar el uso sin conexión. Puedes seguir jugando con internet.')});
home();save();
})();
</script></body></html>
