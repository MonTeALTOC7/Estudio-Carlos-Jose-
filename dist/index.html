function trace(symbol){const free=symbol==='libre',paths=free?[]:E.tracePaths(symbol);page(head('Mi dedo dibuja',home,free?'Libre':'Trazo guiado')+'<div class="lesson-list">'+['círculo','X','línea','ondas','a','e','i','o','u','1','2','3','cuadrado','triángulo','libre'].map(x=>'<button class="mini '+(x===symbol?'active':'')+'" data-trace="'+x+'">'+({círculo:'○',línea:'—',ondas:'∿',cuadrado:'□',triángulo:'△',libre:'🎨'}[x]||x)+'</button>').join('')+'</div><p class="center">'+(free?'Dibuja lo que quieras.':'Sigue el camino. Los puntos dorados muestran dónde empezar.')+'</p><div class="drawbox" id="drawbox"><svg viewBox="0 0 100 100" id="guide">'+paths.map((p,i)=>'<polyline class="guide-path" points="'+p.map(x=>x.join(',')).join(' ')+'"/><circle class="trace-dot" cx="'+p[0][0]+'" cy="'+p[0][1]+'" r="3"/><text x="'+(p[0][0]+5)+'" y="'+(p[0][1]-4)+'" font-size="5" fill="#8b6e35">'+(i+1)+'</text>').join('')+'<circle id="demoDot" r="3" fill="#287859" visibility="hidden"/></svg><canvas id="drawing" aria-label="Área para dibujar"></canvas></div><div class="row" style="justify-content:center"><button class="soft" id="clear">Borrar</button>'+(!free?'<button class="soft" id="demo">▶ Mira cómo</button>':'')+'<button class="primary" id="finish">'+(free?'Guardar mi dibujo':'Revisar mi trazo')+'</button></div><div class="row" style="justify-content:center">'+['#7260a6','#287859','#d06b46','#428ccc'].map((c,i)=>'<button class="palette '+(!i?'selected':'')+'" data-ink="'+c+'" style="--c:'+c+'" aria-label="Color '+c+'"></button>').join('')+'</div><div class="feedback" id="feedback"></div><p class="center"><small>La guía revisa aproximación al camino; no evalúa la escritura escolar.</small></p>','trace');bindBack(home);$$('[data-trace]').forEach(b=>b.onclick=()=>trace(b.dataset.trace));const cv=$('#drawing'),ctx=cv.getContext('2d');let strokes=[],current=null,pointerId=null,color='#7260a6',earned=false,demonstrating=false;const box=$('#drawbox');function size(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=r.width*d;cv.height=r.height*d;redraw()}function redraw(){ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(cv.width/100,0,0,cv.height/100,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=3.8;for(const p of strokes){if(!p.length)continue;ctx.strokeStyle=p.ink||color;ctx.beginPath();ctx.moveTo(...p[0]);for(const z of p.slice(1))ctx.lineTo(...z);ctx.stroke()}}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100]}cv.onpointerdown=e=>{if(demonstrating||current||e.isPrimary===false)return;e.preventDefault();pointerId=e.pointerId;cv.setPointerCapture(e.pointerId);current=[pos(e)];current.ink=color;strokes.push(current)};cv.onpointermove=e=>{if(!current||e.pointerId!==pointerId)return;current.push(pos(e));redraw()};cv.onpointerup=cv.onpointercancel=e=>{if(e.pointerId!==pointerId)return;if(e.type==='pointerup'&&current){current.push(pos(e));redraw()}current=null;pointerId=null};cv.onlostpointercapture=()=>{current=null;pointerId=null};$('#clear').onclick=()=>{strokes=[];earned=false;redraw();$('#feedback').textContent=''};$$('[data-ink]').forEach(b=>b.onclick=()=>{color=b.dataset.ink;$$('[data-ink]').forEach(x=>x.classList.toggle('selected',x===b))});if(!free)$('#demo').onclick=()=>{if(demonstrating)return;demonstrating=true;const points=E.samplePaths(paths),dot=$('#demoDot');dot.setAttribute('visibility','visible');let i=0;function step(){if(i>=points.length){dot.setAttribute('visibility','hidden');demonstrating=false;return}dot.setAttribute('cx',points[i][0]);dot.setAttribute('cy',points[i][1]);i+=2;later(step,35)}step();speak('Mira el punto. Después intenta seguir el camino.')};$('#finish').onclick=()=>{if(free){if(!strokes.some(p=>p.length>5)){speak('Primero dibuja algo.');$('#feedback').textContent='Primero dibuja algo.';return}const a=document.createElement('a');a.download='mi-dibujo.png';a.href=cv.toDataURL();a.click();$('#feedback').textContent='Tu dibujo está listo.';return}const grade=E.gradeTrace(paths,strokes);if(grade.ok){$('#feedback').textContent='¡Recorriste el camino!';speak('¡Recorriste el camino!');if(!earned){s.drawings++;save();earned=true}}else{$('#feedback').textContent=grade.coverage<.72?'Sigue un poquito más del camino.':'Intenta mantener el dedo cerca del camino.';speak($('#feedback').textContent)}};const obs=new ResizeObserver(size);obs.observe(box);cleanup=()=>obs.disconnect();size();}
function parents(){const d=$('#dialog');$('#dialogContent').innerHTML='<h2>Para mamá o papá</h2><p>Escribe el resultado: 4 + 3</p><input id="gate" inputmode="numeric" aria-label="Respuesta"><button id="enter" class="primary">Entrar</button><p id="gateMessage"></p>';d.showModal();$('#enter').onclick=()=>{if($('#gate').value.trim()==='7')dashboard();else $('#gateMessage').textContent='Revisa la respuesta.'};$('#gate').onkeydown=e=>{if(e.key==='Enter')$('#enter').click()}}
function dashboard(){voices();$('#dialogContent').innerHTML='<h2>Aprende desde cero</h2><p>La app inicia con 1–3, a–e y dos colores o figuras. Dos aciertos independientes seguidos por símbolo permiten ampliar el grupo. Lo descubierto permanece disponible aunque necesite repaso. Es una regla del juego, no una valoración escolar.</p><label for="name">Nombre (opcional)</label><input id="name" maxlength="24" value="'+escape(s.name)+'"><p>Si no suena, activa el sonido ♫ y revisa el volumen del teléfono.</p>'+(voiceList.length?'':'<p>No se detectaron voces españolas. Revisa las voces de texto a voz instaladas en el teléfono y vuelve a abrir la app.</p>')+'<label for="voice">Voz en español</label><select id="voice"><option value="">Automática</option>'+voiceList.map(v=>'<option value="'+escape(v.voiceURI)+'" '+(s.voice===v.voiceURI?'selected':'')+'>'+escape(v.name)+' · '+(v.localService?'en dispositivo':'puede necesitar internet')+'</option>').join('')+'</select><label for="rate">Velocidad</label><select id="rate">'+[.75,.85,1].map(v=>'<option value="'+v+'" '+(s.rate===v?'selected':'')+'>'+v+'</option>').join('')+'</select><button class="primary" id="settings">Guardar y escuchar</button><h3 style="margin-top:24px">Lo que está practicando</h3><div class="reports">'+Object.keys(E.groups).map(a=>{const rows=E.groups[a].filter(x=>E.rec(s,a,x).seen||E.rec(s,a,x).independent||E.rec(s,a,x).supported);return '<div class="report"><b>'+titles[a]+'</b>'+(!rows.length?'<p>Aún por explorar</p>':rows.map(x=>{const r=E.rec(s,a,x);return '<p>'+escape(x)+': '+r.independent+' sin ayuda · '+r.supported+' con ayuda'+(r.streak<2?' · Conviene repasar':' · Seguir practicando')+'</p>'}).join(''))+'</div>'}).join('')+'</div><p>Trazos que recorrieron la guía: '+s.drawings+'.</p><div class="hint">Prueba una actividad corta y luego usa papel, juguetes y objetos de casa. El reto no reproduce el examen del colegio. Las respuestas con pista se registran por separado.</div><details style="margin:16px 0"><summary>Referencia para el adulto</summary><p>Adaptación básica del Cuadernillo Didáctico de III Nivel, MINED (2021): cantidades y X (p. 6), posiciones (pp. 8–9), unión de figuras (p. 14), vocales y trazos (pp. 19–22) y cantidades con números (p. 27). Se seleccionan habilidades iniciales; no se cubre todo el año escolar.</p><p>Los datos quedan en este navegador. No se envían a un servidor. La voz usa el servicio del dispositivo o del navegador. Las voces en línea pueden necesitar conexión.</p></details><div class="row"><button class="soft" id="installHelp">Cómo instalar</button><button class="soft" id="reset">Reiniciar progreso</button></div>'+(!storage?'<p>Este navegador no permite guardar el avance.</p>':'');$('#settings').onclick=()=>{s.name=$('#name').value.trim();s.voice=$('#voice').value;s.rate=+$('#rate').value;save();speak('Hola. Vamos a mirar, escuchar y aprender juntos.');notice('Preferencias guardadas')};$('#installHelp').onclick=()=>notice('Abre el enlace HTTPS en Chrome: menú ⋮ → Instalar aplicación o Añadir a inicio. En iPhone: Safari → Compartir → Añadir a inicio.');$('#reset').onclick=()=>{if(confirm('¿Borrar solamente el progreso de esta aplicación?')){const keep={name:s.name,voice:s.voice,rate:s.rate,sound:s.sound};s={...E.fresh(),...keep};save();dashboard()}}}
$('#home').onclick=home;$('#parents').onclick=parents;$('#sound').onclick=()=>{s.sound=!s.sound;if(!s.sound&&'speechSynthesis'in window)speechSynthesis.cancel();save();if(s.sound)speak('Vamos a escuchar.')};$('#closeDialog').onclick=()=>{$('#dialog').close();if(view==='home')home()};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#install').hidden=false});$('#install').onclick=async()=>{if(!installPrompt)return;await installPrompt.prompt();installPrompt=null;$('#install').hidden=true};addEventListener('appinstalled',()=>{$('#install').hidden=true});
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{window.appOfflineReady=true}).catch(()=>{notice('No se pudo preparar el uso sin conexión. Puedes seguir jugando con internet.')});
home();save();
})();
