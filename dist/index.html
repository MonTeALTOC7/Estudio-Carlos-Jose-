@media(max-width:380px){.modulebar button{font-size:14px;padding:9px 12px}.module-grid{gap:8px}.module-option{font-size:14px;gap:6px;padding:9px;min-height:65px}.module-option span{font-size:21px}.relation-grid{gap:9px}.relation-grid .extra{padding:12px}.relation-grid strong{font-size:17px}.pair-example{padding:12px}.pair-example .learning-art{width:94px;height:94px}.reference-scene{gap:4px;padding:8px}.reference-scene .learning-art{width:65px;height:65px}.missing{font-size:35px;padding:0 5px}.concept-options .learning-art{width:105px;height:105px}}

/* ===== v4 · navegación superior con tira de módulos ===== */

.small{font-size:13px}

/* ===== v4 · rutas de aprendizaje ===== */
.gmodhead{display:flex;gap:14px;align-items:center;background:var(--bg,#edf4e8);border-radius:22px;padding:14px 16px;margin-bottom:14px}.gmodhead p{margin:0;color:var(--ink)}.gmodicon{font-size:42px;line-height:1}

.sk-i{font-size:32px;line-height:1}.sk-t{display:flex;flex-direction:column;gap:3px;min-width:0}.sk-t strong{font-size:17px}.sk-t small{color:var(--muted);font-weight:400}.sk-t small.stat{color:var(--green);font-weight:800}.sk-t small.stat.new{color:var(--purple)}

/* modos: «hub» (secciones) y «focus» (actividades) */

@media(min-width:900px){body:has(#app[data-mode="hub"]){padding-left:var(--rail)}.tabbar{top:0;right:auto;bottom:0;width:var(--rail);flex-direction:column;justify-content:center;gap:10px;border-top:0;border-right:1px solid var(--line);padding:12px 8px}.tabbar button{flex:0 0 auto;min-height:78px;font-size:14px}#app[data-mode="hub"]{padding-bottom:30px}.app{max-width:1180px}}

</script><script>/* Dominio de aprendizaje: estados por habilidad, nivel general e insignias.
   Puro y determinista (recibe «ahora»). Principio: el estado se deriva solo de COMPROBACIONES buenas
   repartidas en días distintos; una mala sesión nunca quita lo ya logrado (solo marca «repaso»).
   No se afirman capacidades: se describe lo observado. */
(function(root){
'use strict';
const P={};
const pad=n=>String(n).padStart(2,'0');
P.day=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
P.dayNum=day=>{const [y,m,d]=day.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/86400000)};
P.STATES=['descubrir','aprendiendo','practicando','comprobada','consolidacion'];
P.LABEL={descubrir:'Por descubrir',aprendiendo:'Aprendiendo',practicando:'Practicando',comprobada:'Comprobada',consolidacion:'En consolidación'};
P.ICON={descubrir:'🔍',aprendiendo:'🌱',practicando:'✋',comprobada:'⭐',consolidacion:'🌟'};
P.rank=s=>P.STATES.indexOf(s);
/* Una comprobación es buena si hay al menos 2 de cada 3 respuestas sin ayuda. */
P.good=e=>e.of>0&&e.ok*3>=e.of*2;
/* Historial de una habilidad; los registros de la v4.0 (sin historial) cuentan como una sola sesión. */
P.hist=rec=>{if(!rec)return[];if(rec.hist&&rec.hist.length)return rec.hist;return rec.last?[{d:P.day(rec.ts||0),ts:rec.ts||0,ok:rec.last.ok,of:rec.last.of,ty:[],er:0,hn:0,legacy:true}]:[]};

/* Pruebas permanentes: el historial se recorta (últimas 14 sesiones) pero lo demostrado NO se descarta.
   proof.days = días con comprobación buena; proof.types = formas de jugar con acierto sin ayuda;
   proof.active = días con actividad; proof.persever = hubo una sesión terminada con 3 errores o más.
   Solo crece, así que el estado derivado nunca baja por haber descartado registros antiguos. */
P.HIST_CAP=14;P.PROOF_CAP=120;
const uniq=(a,cap)=>{let u=[...new Set(a)].sort();if(cap&&u.length>cap)u=u.slice(0,10).concat(u.slice(-(cap-10)));return u};
P.proof=rec=>{const b=(rec&&rec.proof)||{},h=P.hist(rec),g=h.filter(P.good);
 return{days:uniq([...(b.days||[]),...g.map(e=>e.d)],P.PROOF_CAP),types:[...new Set([...(b.types||[]),...g.flatMap(e=>e.ty||[])])],active:uniq([...(b.active||[]),...h.map(e=>e.d)],P.PROOF_CAP),persever:!!b.persever||h.some(e=>(e.er||0)>=3)}};
/* Agrega una sesión al registro de una habilidad: recorta el historial sin perder las pruebas. Mutates y devuelve rec. */
P.record=(rec,entry,cap)=>{const o=rec||{},base=o.hist?o.hist.slice():P.hist(o),pr=P.proof({proof:o.proof,hist:base});
 if(P.good(entry)){pr.days=uniq(pr.days.concat(entry.d),P.PROOF_CAP);pr.types=[...new Set(pr.types.concat(entry.ty||[]))]}
 pr.active=uniq(pr.active.concat(entry.d),P.PROOF_CAP);if((entry.er||0)>=3)pr.persever=true;
 base.push(entry);o.hist=base.slice(-(cap||P.HIST_CAP));o.proof=pr;return o};

/* Reglas (también se muestran al adulto):
   Por descubrir: nunca se ha jugado.
   Aprendiendo: se jugó, pero ninguna comprobación tuvo 2 de 3 o más sin ayuda.
   Practicando: una comprobación buena en un solo día.
   Comprobada: comprobaciones buenas en 2 días distintos y con 2 tipos de juego distintos.
   En consolidación: comprobada, con comprobaciones buenas en 3 días distintos repartidos en 6 días o más. */
P.RULES={practicando:'1 comprobación con 2 de 3 o más sin ayuda',comprobada:'comprobaciones buenas en 2 días distintos y con 2 formas de jugar distintas',consolidacion:'comprobaciones buenas en 3 días distintos, repartidas en 6 días o más'};
P.skillState=(rec,nowTs)=>{
 const h=P.hist(rec),today=P.day(nowTs==null?Date.now():nowTs);
 if(!h.length)return{state:'descubrir',repaso:false,sinceGood:null,goodDays:0,types:0,sessions:0,last:null,lastGoodDay:null,lastDay:null};
 const pf=P.proof(rec),days=pf.days,types=new Set(pf.types),last=h[h.length-1];
 let state='aprendiendo';
 if(days.length>=1)state='practicando';
 if(days.length>=2&&types.size>=2)state='comprobada';
 if(state==='comprobada'&&days.length>=3&&P.dayNum(days[days.length-1])-P.dayNum(days[0])>=6)state='consolidacion';
 const lastGoodDay=days.length?days[days.length-1]:null;
 return{state,repaso:P.rank(state)>=2&&last.ok*2<last.of,sinceGood:lastGoodDay?P.dayNum(today)-P.dayNum(lastGoodDay):null,goodDays:days.length,types:types.size,sessions:Math.max(h.length,(rec&&rec.runs)||0),last,lastGoodDay,lastDay:last.d}};
P.WEIGHT={descubrir:0,aprendiendo:1,practicando:2,comprobada:4,consolidacion:6};
P.LEVELS=[{n:1,name:'Explorador',min:0,icon:'🧭'},{n:2,name:'Investigador',min:10,icon:'🔍'},{n:3,name:'Descubridor',min:35,icon:'🔭'},{n:4,name:'Gran Explorador',min:80,icon:'🏔️'},{n:5,name:'Gran Descubridor',min:140,icon:'🌟'}];
/* Puntos = peso del estado actual de cada habilidad + 3 por cada aventura completada alguna vez.
   Repetir una misma habilidad el mismo día no suma: el nivel no depende de contar clics ni partidas. */
P.points=(states,advDone)=>Object.values(states).reduce((a,s)=>a+P.WEIGHT[s.state],0)+3*(advDone||0);
P.level=(pts,storedN)=>{let cur=P.LEVELS[0];for(const L of P.LEVELS)if(pts>=L.min)cur=L;if(storedN&&storedN>cur.n)cur=P.LEVELS[storedN-1];const next=P.LEVELS[cur.n]||null;
 return{level:cur,next,into:Math.max(0,pts-cur.min),span:next?next.min-cur.min:0,remaining:next?Math.max(0,next.min-pts):0,points:pts}};

/* Resumen por ruta: cuántas habilidades hay en cada estado. No se calculan porcentajes. */
P.route=(skillIds,states)=>{const c={descubrir:0,aprendiendo:0,practicando:0,comprobada:0,consolidacion:0,repaso:0,total:skillIds.length};
 for(const id of skillIds){const s=states[id];c[s.state]++;if(s.repaso)c.repaso++}
 c.descubiertas=c.total-c.descubrir;c.enPractica=c.aprendiendo+c.practicando;c.comprobadas=c.comprobada+c.consolidacion;return c};

/* Estados de todas las habilidades a partir del registro guardado. */
P.all=(skills,recs,nowTs)=>{const out={};for(const s of skills)out[s.id]=P.skillState((recs||{})[s.id],nowTs);return out};

/* Insignias: se ganan una vez y se conservan para siempre. */
P.badgeCtx=(skills,mods,advList,recs,adv,states,nowTs)=>{
 const days=new Set(),routes=new Set();let sessions=0,persever=false,recalled=false;
 for(const s of skills){const rec=(recs||{})[s.id],h=P.hist(rec);if(!h.length)continue;routes.add(s.mod);sessions+=Math.max(h.length,(rec&&rec.runs)||0);const pf=P.proof(rec);pf.active.forEach(d=>days.add(d));if(pf.persever)persever=true;
  const gd=pf.days;if(gd.length>=2&&P.dayNum(gd[gd.length-1])-P.dayNum(gd[0])>=3)recalled=true}
 const advDone=new Set(Object.keys(adv||{}).filter(k=>adv[k].runs>0));for(const k of advDone)if(adv[k].ts)days.add(P.day(adv[k].ts));
 return{skills,mods,advList,states,routes,days,sessions,persever,recalled,advDone,pts:P.points(states,advDone.size)};};
const nS=(c,min)=>Object.values(c.states).filter(s=>P.rank(s.state)>=P.rank(min)).length;
P.BADGES=[
 {id:'primer-paso',icon:'👣',title:'Primer paso',kid:'¡Empezaste a aprender!',test:c=>c.sessions>=1},
 {id:'curioso',icon:'🔎',title:'Curioso',kid:'Probaste cuatro rutas distintas.',test:c=>c.routes.size>=4},
 {id:'volvio',icon:'🌅',title:'Volví a jugar',kid:'Volviste a jugar en otros días.',test:c=>c.days.size>=3},
 {id:'perseverante',icon:'💪',title:'Sigo intentando',kid:'Aunque costó, terminaste.',test:c=>c.persever},
 {id:'recordo',icon:'🧠',title:'¡Me acordé!',kid:'Lo recordaste días después.',test:c=>c.recalled},
 {id:'estrella-1',icon:'⭐',title:'Primera estrella',kid:'Una habilidad comprobada.',test:c=>nS(c,'comprobada')>=1},
 {id:'estrella-5',icon:'🌠',title:'Cinco estrellas',kid:'Cinco habilidades comprobadas.',test:c=>nS(c,'comprobada')>=5},
 {id:'consolidada',icon:'🌟',title:'Se quedó conmigo',kid:'Una habilidad ya consolidada.',test:c=>nS(c,'consolidacion')>=1},
 {id:'aventuras-todas',icon:'🏆',title:'Gran aventurero',kid:'Completaste todas las aventuras.',test:c=>c.advList.length>0&&c.advList.every(a=>c.advDone.has(a.id))},
 ...[2,3,4,5].map(n=>({id:'nivel-'+n,icon:P.LEVELS[n-1].icon,title:'Nivel '+P.LEVELS[n-1].name,kid:'¡Ahora eres '+P.LEVELS[n-1].name+'!',test:c=>c.pts>=P.LEVELS[n-1].min}))];

P.allBadges=c=>[...P.BADGES,
 ...c.mods.map(m=>({id:'ruta-'+m.id,icon:m.icon,title:'Explorador: '+m.title,kid:'Practicaste buena parte de esta ruta.',test:cc=>{const ids=cc.skills.filter(s=>s.mod===m.id).map(s=>s.id);return ids.filter(i=>P.rank(cc.states[i].state)>=2).length>=Math.ceil(ids.length/2)}})),

/* ---------- progreso guardado ---------- */
function gdata(){const s=S();s.games=s.games||{skills:{},mixed:null};s.games.skills=s.games.skills||{};return s.games}
function saveResult(id,res){const g=gdata(),o=g.skills[id]||{runs:0,best:0,ind:0,sup:0,last:null},now=Date.now();
 /* Progress.record recorta el historial a las últimas sesiones pero conserva las pruebas permanentes (días y formas con comprobación buena). */
 root.Progress.record(o,{d:root.Progress.day(now),ts:now,ok:res.ok,of:res.of,pi:res.pi||0,ps:res.ps||0,er:res.er||0,hn:res.hn||0,ty:res.ty||[],bad:res.bad||[],mode:res.mode||'full',src:res.src||'libre'});
 o.runs++;o.ind+=res.ind;o.sup+=res.sup;o.last={ok:res.ok,of:res.of};o.best=Math.max(o.best,res.ok);o.ts=now;g.skills[id]=o;K.save()}
/* Guardado para reanudar la última actividad (JSON sencillo; las preguntas ya generadas se conservan). */
function snapObj(){const sess=Object.assign({},run.sess);delete sess.skill;delete sess.more;return{k:'skill',id:run.sk.id,mode:run.mode||'full',phase:run.phase,i:run.i,res:run.res,more:run.more,streak:run.streak||0,data:sess,ts:Date.now()}}
/* En una clase guiada el avance se guarda dentro del curso (s.course.cur.snap); el juego libre sigue usando s.resume. Así una cosa nunca pisa a la otra. */
function snap(){if(!run||run.kind!=='skill')return;if(run.course){const c=root.Curriculum.ensure(S());if(c.cur&&c.cur.l===run.course.l){c.cur.snap=snapObj();c.cur.ts=Date.now();K.save()}return}S().resume=snapObj();K.save()}

/* Camino con flechas: llevar al personaje hasta la escuela esquivando árboles. */
const DIRS={up:[0,-1,'arriba','⬆️'],down:[0,1,'abajo','⬇️'],left:[-1,0,'a la izquierda','⬅️'],right:[1,0,'a la derecha','➡️']};
function walkPlan(rng){for(let t=0;t<60;t++){const W=4,H=3,sy=Math.floor(rng()*H),gy=Math.floor(rng()*H),obs=new Set();while(obs.size<3){const x=1+Math.floor(rng()*2),y=Math.floor(rng()*H);if(!(x===0&&y===sy)&&!(x===3&&y===gy))obs.add(x+','+y)}
 const seen=new Set(['0,'+sy]),q=[[0,sy]];while(q.length){const [x,y]=q.shift();for(const [dx,dy] of Object.values(DIRS).map(d=>d)){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(nx<0||ny<0||nx>=W||ny>=H||obs.has(k)||seen.has(k))continue;seen.add(k);q.push([nx,ny])}}
 if(seen.has('3,'+gy))return{W,H,start:[0,sy],goal:[3,gy],obs:[...obs]}}
 return{W:4,H:3,start:[0,1],goal:[3,1],obs:[]}}
MEC.walk=(ch,box,ctl)=>{
 let [x,y]=ch.start;const face=K.shell?K.shell.avatar('face','tiny'):'🧒',obs=new Set(ch.obs);
 const cells=()=>{let o='';for(let j=0;j<ch.H;j++)for(let i=0;i<ch.W;i++){const k=i+','+j;o+='<span class="wcell'+(obs.has(k)?' obs':'')+'">'+(obs.has(k)?'🌳':(i===ch.goal[0]&&j===ch.goal[1]?'🏫':(i===x&&j===y?'<span class="wme">'+face+'</span>':'')))+'</span>'}return o};

 qa('.arr',box).forEach(b=>b.onclick=()=>{if(ctl.st.done)return;const d=DIRS[b.dataset.d],nx=x+d[0],ny=y+d[1];K.speak(d[2]);
  if(nx<0||ny<0||nx>=ch.W||ny>=ch.H){ctl.err('Por ahí no hay camino.');return}
  if(obs.has(nx+','+ny)){ctl.err('¡Ahí hay un árbol! Busca otro camino.');return}
  x=nx;y=ny;X.sTap();redraw();if(x===ch.goal[0]&&y===ch.goal[1])ctl.ok('¡Llegaste a la escuela!');else ctl.fb('')});
 return{hint(){const seen=new Set([x+','+y]),Q=[[x,y,[]]];let path=[];while(Q.length){const [cx,cy,p]=Q.shift();if(cx===ch.goal[0]&&cy===ch.goal[1]){path=p;break}for(const k of Object.keys(DIRS)){const d=DIRS[k],nx=cx+d[0],ny=cy+d[1],kk=nx+','+ny;if(nx<0||ny<0||nx>=ch.W||ny>=ch.H||obs.has(kk)||seen.has(kk))continue;seen.add(kk);Q.push([nx,ny,p.concat(k)])}}
  const nxt=path[0];if(nxt){const b=qa('.arr',box).find(a=>a.dataset.d===nxt);if(b)b.classList.add('ghint');ctl.fb('Prueba '+DIRS[nxt][2]+'.');K.speak('Prueba '+DIRS[nxt][2]+'.')}}}};

ADV.forEach(a=>{a.skills=a.skills.filter(i=>C.byId[i])});

/* ===================== ejecución ===================== */
let run=null;
const advOf=id=>ADV.find(a=>a.id===id);
const view=id=>run&&run.lesson?'cls:adv':'adv:'+id;
function dots(i,n,res){return '<div class="advdots" aria-hidden="true">'+Array.from({length:n},(_,k)=>'<i class="'+(k<i?(res[k]?'ok':'help'):k===i?'now':'')+'"></i>').join('')+'</div>'}
function snapA(){if(!run||run.lesson)return;const s=S();s.resume={k:'adv',id:run.a.id,i:run.i,res:run.res,chs:run.chs,ts:Date.now()};K.save()}

function resume(){const r=S().resume,info=resumeInfo();if(!info)return false;run={a:advOf(r.id),chs:r.chs,i:r.i,res:r.res};r.i<0?intro():challenge();return true}
function leave(){if(run&&run.lesson){run.onLeave();return}K.shell?K.shell.jugar():K.home()}
function intro(){const a=run.a,face=K.shell.avatar('hero','adv');
 K.page(K.head(a.title,leave,'Aventura')+'<div class="advintro" style="--a:'+a.color+'"><div class="ai-scene" aria-hidden="true"><span class="ai-big">'+a.icon+'</span></div><div class="ai-row"><div class="ai-char">'+face+'</div><div class="ai-bubble"><p>'+esc(a.story)+'</p></div></div><div class="row center"><button class="soft" id="ahear">♫ Escuchar</button><button class="primary xl" id="astart">¡Vamos!</button></div></div>',view(a.id));
 K.bindBack(leave);q1('#ahear').onclick=()=>K.speakTap(a.story);q1('#astart').onclick=()=>{run.i=0;snapA();challenge()};K.speak(a.story);snapA()}
function challenge(){
 const a=run.a,ch=run.chs[run.i],n=run.chs.length;snapA();
 K.page(K.head(a.title,leave,run.lesson?'Jugamos':'Reto '+(run.i+1)+' de '+n)+'<div class="advframe" style="--a:'+a.color+'">'+dots(run.i,n,run.res)+'<div class="ch-say"><span class="ch-face">'+K.shell.avatar('face','tiny')+'</span><div class="ai-bubble"><b>'+esc(ch.title)+'</b><p id="chsay">'+esc(ch.say)+'</p></div><button class="soft" id="chear" aria-label="Escuchar">♫</button></div>'+(ch.mech==='q'?'<h2 class="gprompt">'+esc(ch.q.prompt)+'</h2>':'')+'<div id="gbox"></div><div class="feedback" id="gfb" aria-live="polite"></div><div class="row center"><button class="soft" id="ghint">Ver una pista</button><button class="primary" id="gnext" hidden>Siguiente →</button></div></div>',view(a.id));
 window.__gch=ch;K.bindBack(leave);if(K.audio)K.audio.attention(ch.mech==='memory');
 const sayT=ch.mech==='q'?ch.say+' '+(ch.q.say||ch.q.prompt):ch.say;q1('#chear').onclick=()=>K.speakTap(sayT);
 const st={errors:0,hinted:false,done:false},ctl={st,fb:t=>{const f=q1('#gfb');if(f)f.innerHTML=t},
  err(m){st.errors++;X.sBad();if(m){ctl.fb(m);K.speak(X.plain(m))}},
  ok(m){if(st.done)return;st.done=true;X.sGood();const asst=st.errors>0||st.hinted,msg=m||(asst?'¡Lo encontramos juntos!':pickOf(X.GOODS));ctl.fb(msg);K.speak(X.plain(msg));q1('#ghint').hidden=true;q1('#gnext').hidden=false;run.res[run.i]=!asst;
   run.streak=asst?0:(run.streak||0)+1;if(!asst&&run.streak%3===0&&K.shell)K.shell.celebrate({kind:'streak'});const nb=q1('#gnext');if(nb.scrollIntoView)nb.scrollIntoView({block:'nearest',behavior:'smooth'})}};
 const m=MEC[ch.mech](ch,q1('#gbox'),ctl);
 q1('#ghint').onclick=()=>{if(st.done)return;st.hinted=true;m.hint()};
 q1('#gnext').onclick=()=>{run.i++;if(run.i>=n){if(run.lesson){run.onDone({ok:!!run.res[0]});return}finish()}else challenge()};
 if(ch.mech!=='cross'&&ch.mech!=='memory')K.speak(sayT)}
function finish(){

 const news=K.shell.evaluate();if(news){news.adv=a;news.stars=stars}

</script><script>/* Orquestador de clases guiadas («Mi camino de aprendizaje»).
   NO es otro motor educativo: ordena y encadena lo que ya existe (openSkill con sus cinco fases, rondas de símbolos del módulo original,
   retos de aventura) según el currículo de curriculum.js. Todo el estado propio vive en state.course; el juego libre nunca lo modifica. */
(function(root){
'use strict';
root.CourseUI=function(K,G,Adv,Sh){
const CUR=root.Curriculum,C=root.Content,P=root.Progress,esc=K.escape;
const qa=(sel,r)=>Array.from((r||document).querySelectorAll(sel)),q1=(sel,r)=>(r||document).querySelector(sel);
const S=()=>K.state(),course=()=>CUR.ensure(S()),nm=()=>Sh.nm(),now=()=>Date.now(),save=()=>K.save();
let act=false,news=null;
const speak=(t,tap)=>tap&&K.speakTap?K.speakTap(t):K.speak(t);
function env(){const sn=Sh.snapshot();return{states:sn.states,sym:K.symCounts(),sn}}
const unitOf=l=>CUR.units[CUR.unitIndex(l.unit)];
const titleOf=id=>C.byId[id]?C.byId[id].title:id;
const PHASE_L={learn:'Aprendo',examples:'Ejemplos',practice:'Practico',reinforce:'Refuerzo',check:'Compruebo'};

/* ---------- estado visible desde la portada ---------- */
function stepLabel(cur){if(!cur)return'';if(cur.step==='welcome')return'Al empezar';if(cur.step==='game')return'Jugamos';if(cur.step==='recall')return'Recordamos';
 if(cur.snap&&cur.snap.phase)return PHASE_L[cur.snap.phase]||'En marcha';if(cur.items&&cur.items.length)return'Repaso '+(cur.items.length+1);return'En marcha'}
function homeInfo(){const c=course(),e=env(),n=CUR.next(c,e,now()),u=CUR.currentUnit(c),up=CUR.unitProgress(c,u.id),ls=CUR.unitLessons(u.id);
 let label,sub;
 if(n.kind==='continuar'){label='Continuar mi clase';sub=n.lesson.kid+' · '+stepLabel(c.cur)}
 else if(n.kind==='primera'){label='Empezar mi primera clase';sub=n.lesson.kid}
 else if(n.kind==='siguiente'){label='Mi siguiente clase';sub=n.lesson.kid+(n.mode==='refuerzo'?' · otra mirada con calma':n.mode==='confirmar'?' · solo lo comprobamos':'')}
 else{label='Repasar mi camino';sub='¡Recorriste todo el camino!'}
 return{label,sub,kind:n.kind,lesson:n.lesson,mode:n.mode,reason:n.reason,cur:!!c.cur,
  unit:{n:CUR.unitIndex(u.id)+1,total:CUR.units.length,title:u.title,icon:u.icon,done:up.done,total2:up.total,pips:ls.map(l=>c.cur&&c.cur.l===l.id?'c':CUR.isDone(c,l.id)?'d':CUR.status(c,l.id)==='refuerzo'?'r':'')}}}

/* ---------- pantallas puente ---------- */
function bridge(o){K.page('<div class="clsbridge"><div class="cb-i" aria-hidden="true">'+o.icon+'</div><span class="eyebrow">'+esc(o.eyebrow||'Mi clase')+'</span><h1>'+esc(o.title)+'</h1><p class="lead">'+esc(o.text)+'</p><div class="row center"><button class="soft" id="cbhear">♫ Escuchar</button><button class="primary xl" id="cbgo">'+esc(o.btn||'▶ Seguir')+'</button></div><div class="row center"><button class="linkb" id="cblater">Ahora no, guardar mi lugar</button></div></div>','cls:bridge');
 q1('#cbgo').onclick=o.go;q1('#cblater').onclick=pause;q1('#cbhear').onclick=()=>speak(o.say||o.text,1);speak(o.say||o.text)}

/* ---------- comenzar, pausar, reanudar ---------- */
function begin(){const c=course();if(c.cur){resume();return}const n=CUR.next(c,env(),now());if(!n.lesson){camino();return}
 if(!c.started&&!c.diag.done&&!c.diag.skipped&&!Object.keys(c.done).length){mochilaIntro();return}
 start(n.lesson,n.mode)}
function start(l,mode){const c=course();c.cur={l:l.id,mode:mode||'nueva',step:'welcome',recall:null,items:[],rs:null,game:0,struggle:0,cd:null,snap:null,t0:now(),symBefore:(K.symCounts()[l.area]||0)};save();act=true;welcome(l)}
function pause(){const c=course();act=false;if(c.cur){save();K.notice('Tu clase quedó guardada. ¡Aquí te esperamos!')}Sh.hoy()}
function abandon(){const c=course();c.cur=null;save();act=false}
function resume(){const c=course(),cur=c.cur,l=cur&&CUR.byId[cur.l];if(!l){c.cur=null;save();Sh.hoy();return}act=true;
 if(cur.step==='welcome'){welcome(l);return}
 if(cur.cd&&cur.snap){if(cur.step==='game'){G.rebuildRun(cur.snap,cur.cd,true);gameBridge(l);return}G.rebuildRun(cur.snap,cur.cd);return}
 if(cur.step==='recall'){recallStep(l);return}
 mainStep(l)}

/* ---------- bienvenida ---------- */
function planSteps(l,cur){const c=course(),steps=[],long=c.prefs.min>8;
 if(cur.mode==='confirmar'){steps.push(['⭐','Comprobamos lo que ya sabes'])}
 else if(l.kind==='skill'){if(long&&CUR.pickRecall(c,l,now()))steps.push(['🧠','Recordamos algo que ya aprendimos']);steps.push(['💡','Aprendemos y vemos ejemplos']);steps.push(['✋','Practicamos con ayudas']);if(l.game&&c.prefs.game&&long)steps.push(['🎮','Jugamos']);steps.push(['⭐','Comprobamos'])}
 else if(l.kind==='symbols'){if(long&&CUR.pickRecall(c,l,now()))steps.push(['🧠','Recordamos algo que ya aprendimos']);steps.push(['👀','Miramos y escuchamos']);steps.push(['✋','Practicamos'])}
 else steps.push(['🧠','Recordamos tres cosas']);
 steps.push(['🎉','Celebramos y vemos qué sigue']);return steps}
function welcome(l){const c=course(),cur=c.cur,u=unitOf(l),say='¡Hola, '+nm()+'! Hoy vamos a '+l.hook+'.'+(cur.mode==='confirmar'?' Ya sabes algo de esto, así que solo lo comprobamos.':cur.mode==='refuerzo'?' Lo miramos otra vez, con calma.':'');
 K.page('<div class="clswel"><span class="chip">'+u.icon+' Unidad '+(CUR.unitIndex(u.id)+1)+' · '+esc(u.title)+'</span><div class="cw-char" aria-hidden="true">'+Sh.avatar('face','cwface')+'</div><span class="eyebrow">Mi clase</span><h1>'+esc(l.kid)+'</h1><p class="lead">'+esc(say)+'</p><ol class="cw-steps">'+planSteps(l,cur).map(([e,t])=>'<li><i aria-hidden="true">'+e+'</i><span>'+esc(t)+'</span></li>').join('')+'</ol><p class="small">Unos '+c.prefs.min+' minutos, sin prisa. Puedes parar cuando quieras: tu lugar queda guardado.</p><div class="row center"><button class="soft" id="cwhear">♫ Escuchar</button><button class="primary xl" id="cwgo">▶ ¡Vamos!</button></div><div class="row center"><button class="linkb" id="cwlater">Ahora no, guardar mi lugar</button></div></div>','cls:welcome');
 q1('#cwhear').onclick=()=>speak(say,1);q1('#cwlater').onclick=pause;q1('#cwgo').onclick=()=>{if(cur.mode!=='confirmar'&&c.prefs.min>8&&CUR.pickRecall(c,l,now()))recallStep(l);else mainStep(l)};speak(say)}

/* ---------- 2 · recordamos ---------- */
function recallStep(l){const c=course(),cur=c.cur,r=CUR.pickRecall(c,l,now());if(!r){mainStep(l);return}
 cur.step='recall';cur.recall={skill:r.skill,why:r.why,done:0};cur.cd={role:'recall',l:l.id,skill:r.skill};cur.snap=null;save();
 const t=titleOf(r.skill),say='Antes de aprender algo nuevo, recordamos: '+t+'. Son solo dos preguntas.';
 bridge({icon:C.byId[r.skill].icon,eyebrow:'Recordamos',title:t,text:say,btn:'▶ Recordar',go:()=>G.openSkill(r.skill,'review',{limit:2,course:cur.cd})})}

/* ---------- 3-5 · aprendemos, ejemplos, practicamos, jugamos, comprobamos ---------- */
function mainStep(l){const c=course(),cur=c.cur;cur.step='main';cur.snap=null;
 if(l.kind==='skill'){const sk0=C.byId[l.skill];if(sk0.available&&!sk0.available(C.ctxFrom(K.E,S(),new Date()))){bridge({icon:'✏️',eyebrow:'Mi clase',title:'Falta mi nombre',text:'Para esta clase un adulto debe escribir el nombre en Ajustes. Tu lugar queda guardado.',btn:'Entendido',go:pause});return}
  const mode=({nueva:'full',refuerzo:'extra',confirmar:'review',repaso:'full'})[cur.mode]||'full';cur.cd={role:'main',l:l.id,mode:cur.mode};save();G.openSkill(l.skill,mode,{course:cur.cd})}
 else if(l.kind==='symbols'){cur.cd=null;cur.symBefore=K.symCounts()[l.area]||0;save();K.startRound(l.area,null,{l:l.id,role:'main'})}
 else reviewNext(l)}
function reviewNext(l){const c=course(),cur=c.cur;if(!cur.rs)cur.rs=CUR.reviewSkills(c,l,now());
 if(!cur.rs.length){finishLesson(l,{ok:true,ck:[0,0],mode:'repaso',items:[]});return}
 if(cur.items.length>=cur.rs.length){const g=cur.items.filter(i=>i.good).length;finishLesson(l,{ok:g>=Math.min(2,cur.items.length),ck:[g,cur.items.length],mode:'repaso',items:cur.items.map(i=>({skill:i.skill,good:i.good}))});return}
 const i=cur.items.length,sk=cur.rs[i];cur.cd={role:'review',l:l.id,skill:sk,idx:i};cur.snap=null;save();
 const say='Recordamos: '+titleOf(sk)+'. Son dos preguntas.';
 bridge({icon:C.byId[sk].icon,eyebrow:'Repaso '+(i+1)+' de '+cur.rs.length,title:titleOf(sk),text:say,btn:'▶ Recordar',go:()=>G.openSkill(sk,'review',{limit:2,course:cur.cd})})}

/* Se llama justo antes de la comprobación: si hay un juego relacionado, se juega ahora (decisión pedagógica: practicar jugando antes de comprobar). */
function beforeCheck(run){const c=course(),cur=c.cur,cd=run.course;if(!cur||!cd||cd.role!=='main'||cur.l!==cd.l)return false;const l=CUR.byId[cur.l];
 const fails=[...run.res.practice,...run.res.reinforce].filter(r=>!r.ok).length;if(fails>=3)cur.struggle=1;
 const want=l.game&&c.prefs.game&&c.prefs.min>8&&cur.mode!=='confirmar'&&cur.mode!=='repaso'&&!cur.struggle&&!cur.game;
 if(!want){save();return false}
 cur.step='game';G.snapNow();save();gameBridge(l);return true}
function gameBridge(l){const cur=course().cur;
 bridge({icon:'🎮',eyebrow:'Jugamos',title:'¡Ahora jugamos!',text:'Un juego para practicar lo que aprendimos. Después comprobamos.',btn:'▶ ¡A jugar!',

function confetti(n,ms){if(!motionOK())return;const cv=$('#confetti');if(!cv)return;const d=Math.min(root.devicePixelRatio||1,2),w=root.innerWidth,h=root.innerHeight;cv.width=w*d;cv.height=h*d;const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);
 const ps=Array.from({length:n},()=>({x:w*(.2+Math.random()*.6),y:h*.35,vx:(Math.random()-.5)*9,vy:-4-Math.random()*8,r:4+Math.random()*5,c:COL[Math.floor(Math.random()*COL.length)],a:Math.random()*6,va:(Math.random()-.5)*.4}));
 const t0=performance.now();cancelAnimationFrame(raf);
 (function f(t){const k=t-t0;x.clearRect(0,0,w,h);ps.forEach(p=>{p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.globalAlpha=Math.max(0,1-k/ms);x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(k<ms)raf=requestAnimationFrame(f);else x.clearRect(0,0,w,h)})(t0)}
