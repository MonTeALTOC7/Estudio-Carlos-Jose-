name: Comprobar juegos
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    name: Lógica y distribución (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in app.js engine.js activities.js content.js skills-a.js skills-b.js skills-c.js progress.js coach.js curriculum.js people.js games.js adventures.js course.js pwa.js audio.js shell.js build.cjs test.cjs; do node --check $f; done && node build.cjs && node test.cjs && node qa/audit-pedagogica.cjs
  visual:
    name: Funciones visuales críticas (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.cjs
      - name: Instalar Playwright (solo para pruebas; la app no tiene dependencias)
        working-directory: qa
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Diseño, arrastre táctil, persistencia, respaldo, PWA, sin conexión, actualización y canal de prueba
        run: node qa/ci-visual.cjs --out=qa-out
      - name: Simulación de Cloudflare Pages (compilación exacta, raíz del dominio, cabeceras, PWA, sin conexión, actualización)
        run: node qa/cloudflare-check.cjs
      - name: Instalación contextual y actualización segura de la PWA (simulada en Chromium)
        run: node qa/pwa-smoke.cjs
      - name: Resumen en la página del flujo
        if: always()
        run: if [ -f qa-out/resumen.md ]; then cat qa-out/resumen.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-y-resultados-visuales
          path: qa-out
          retention-days: 14
  clases:
    name: Modo clase guiada y audio (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.cjs
      - working-directory: qa
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Clases, reanudar, juego libre, repasos, exploración inicial, datos anteriores, panel adulto, voz, música y efectos (390 px)
        run: node qa/course-smoke.cjs --viewport=390x844 --shots=qa-out/clases
      - name: Diseño del camino y del panel adulto (320 px y 1440 px)
        run: node qa/course-smoke.cjs --viewport=320x640 --only=8,9 && node qa/course-smoke.cjs --viewport=1440x900 --only=8,9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-clases
          path: qa-out
          retention-days: 14
          if-no-files-found: ignore
  tablet:
    name: Galaxy Tab A9 emulada (vertical y horizontal) y Partes del cuerpo (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.cjs
      - working-directory: qa
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: "Partes de mi cuerpo en teléfono y tablet: zonas táctiles, fases y otras personas"
        run: node qa/partes-smoke.cjs --viewport=390x844 && node qa/partes-smoke.cjs --viewport=1005x540 && node qa/partes-smoke.cjs --viewport=600x950
      - name: "Tablet emulada: 6 viewports con diseño, objetivos táctiles, arrastre, trazado y toque con el dedo"
        run: node qa/tablet-smoke.cjs
  flujos:
    name: Recorridos de uso (portada, aventuras, panel, regresión, 15 habilidades)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.cjs
      - working-directory: qa
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Portada, recomendaciones, reanudar, repaso, 5 aventuras, panel y respaldo (390 px)
        run: node qa/v5-smoke.cjs --viewport=390x844
      - name: Regresión de los juegos y del progreso anteriores (390 px)
        run: node qa/legacy-smoke.cjs --viewport=390x844
      - name: Una habilidad de cada tipo de interacción (320 px)
        run: node qa/ui-smoke.cjs --viewport=320x640 --only=contar,clasif-color,vocal-inicial,rimas,antes-despues,posiciones,instrucciones,series,une-puntos,pintar,partes,silabas,que-falta,simon,mi-nombre
