name: Comprobar juegos
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in app.js engine.js activities.js content.js skills-a.js skills-b.js skills-c.js games.js build.cjs test.cjs; do node --check $f; done && node build.cjs && node test.cjs
